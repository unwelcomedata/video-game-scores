project_name: "video-game-scores"

paths:
  data_raw:       data/raw        # downloaded source files, never modified
  data_interim:   data/interim    # intermediate cleaned/joined tables
  data_processed: data/processed  # final analysis-ready tables
  export:         export          # sellable dataset packages (csv, xlsx, parquet)
  outputs:        outputs         # chart images (exploratory)
  outputs_social: outputs/social  # publication-ready social media charts
  notebooks:      notebooks

settings:
  encoding: utf-8
  parquet_engine: pyarrow
  duckdb_file: data/project.duckdb   # single file DB for the project

sources:
  # IGDB (Internet Game Database) API — owned by Twitch/Amazon, free for
  # non-commercial use, queried via its v4 API (NOT scraped). Each game can carry:
  #   - aggregated_rating       : external CRITIC score aggregate (0-100 double)
  #   - aggregated_rating_count : number of critic scores behind it
  #   - rating                  : IGDB USER/community rating (0-100 double)
  #   - rating_count            : number of user ratings
  #   - first_release_date      : unix timestamp (we derive release_year)
  # Auth: a short-lived OAuth token minted from a Twitch app (TWITCH_CLIENT_ID +
  # TWITCH_CLIENT_SECRET in .env). Chosen over RAWG/Metacritic because IGDB's
  # critic coverage keeps up with recent releases (Metacritic aggregation lags).
  igdb_games:
    base_url: https://api.igdb.com/v4/games
    token_url: https://id.twitch.tv/oauth2/token
    type: igdb_api
    page_size: 500            # IGDB max limit per request
    rate_limit_seconds: 0.30  # IGDB allows ~4 req/s; 0.3s is polite and safe
    # We keep games that HAVE a critic aggregate with enough reviews to be
    # meaningful. Threshold set in 01-ingest via the `where` clause:
    min_aggregated_rating_count: 3   # require >= 3 critic scores behind the aggregate

export:
  formats:
    - csv
    - xlsx
    - parquet
  include_codebook: true       # generate a column-description markdown alongside each export
  strip_pii_columns: []        # list column names to drop before packaging
